name: Firmware build

on:
  push:
    paths:
      - 'development/**'
      - 'source/**'
      - 'assembly/**'
      - 'Test Firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'development/**'
      - 'source/**'
      - 'assembly/**'
      - 'Test Firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build firmware (reference LLVM 17.0.0)
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3

      - name: Check toolchain
        run: |
          clang --version | tee /tmp/clang-version.txt
          ld.lld --version | tee /tmp/lld-version.txt
          grep -F 'clang version 17.0.0' /tmp/clang-version.txt
          grep -F 'LLD 17.0.0' /tmp/lld-version.txt
          grep -F '10999b6d034fe318f3d56c83bddb6572593a8bb0' /tmp/clang-version.txt
          grep -F '10999b6d034fe318f3d56c83bddb6572593a8bb0' /tmp/lld-version.txt
          llvm-objcopy --version
          cmake --version
          ninja --version

      - name: Build factory C
        working-directory: development
        run: |
          cmake -S . -B build/factory -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-clang.cmake
          cmake --build build/factory

      - name: Check standalone C source
        run: |
          diff -r source/src development/factory/src
          diff -r source/include development/factory/include
          cmp source/layout.ld development/factory/layout.ld

      - name: Build Custom R02
        run: |
          cd 'Test Firmware/R02/SERVO42C_Custom_R02_Source'
          cmake -S . -B build/custom -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-clang.cmake
          cmake --build build/custom

      - name: Build Custom R02 profiling
        run: |
          cd 'Test Firmware/R02/SERVO42C_Custom_R02_Source'
          cmake -S . -B build/profile -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-clang.cmake -DSYSINFO_PROFILE=ON
          cmake --build build/profile

      - name: Reassemble factory reference
        working-directory: assembly
        run: python3 build.py

      - name: Package application builds
        run: |
          mkdir -p artifacts/factory artifacts/R02 artifacts/R02-profile
          for file in servo42c.elf servo42c.map build_report.json; do
            cp "development/build/factory/$file" "artifacts/factory/$file"
            cp "Test Firmware/R02/SERVO42C_Custom_R02_Source/build/custom/$file" "artifacts/R02/$file"
            cp "Test Firmware/R02/SERVO42C_Custom_R02_Source/build/profile/$file" "artifacts/R02-profile/$file"
          done
          printf '%s\n' 'Application builds only; not complete flash images.' 'Preserve each board’s original identity, settings and calibration. See Test Firmware/R02/SERVO42C_Custom_R02_Source/FLASHING.md.' > artifacts/README.txt
          cd artifacts
          find factory R02 R02-profile -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload application builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo42c-applications
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
