name: OpenSERVO42C core
on:
  push:
    branches: [open-firmware]
    paths:
      - 'OpenSERVO42C/**'
      - '.github/workflows/open-firmware.yml'
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host and ARM build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk clang lld
      - name: Configure
        run: cmake -S OpenSERVO42C -B build/open -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build/open
      - name: Test
        run: ctest --test-dir build/open --output-on-failure
      - name: Check Cortex-M0+ memory budgets
        run: python3 OpenSERVO42C/tests/test_link_budget.py

      - name: Compile all Cortex-M0+ modules
        run: python3 OpenSERVO42C/tools/check_arm.py

      - name: Verify complete target link
        run: python3 OpenSERVO42C/tools/check_target_link.py

      - name: Link hardware acquisition application (unused sections removed)
        run: python3 OpenSERVO42C/tools/check_target_link.py --bringup --gc-only

      - name: Link optimized acquisition application
        run: python3 OpenSERVO42C/tools/check_target_link.py --bringup --optimized

      # Full-feature motor application requires size optimization. The complete
      # all-module fixture above still checks all target symbols without LTO.
      - name: Link optimized motor runtime
        run: python3 OpenSERVO42C/tools/check_target_link.py --motor --optimized

      - name: Archive exact OpenSERVO42C source
        if: always()
        run: git archive --format=zip --output=openservo-source.zip HEAD OpenSERVO42C .github/workflows/open-firmware.yml

      - name: Publish source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openservo-source-${{ github.sha }}
          path: openservo-source.zip
          retention-days: 14
          if-no-files-found: error
