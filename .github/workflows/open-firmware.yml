name: OpenSERVO42C core
on:
  push:
    branches: [open-firmware]
    paths:
      - 'OpenSERVO42C/**'
      - '.github/workflows/open-firmware.yml'
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S OpenSERVO42C -B build/open
      - name: Build
        run: cmake --build build/open
      - name: Test
        run: ctest --test-dir build/open --output-on-failure
      - name: Install ARM-capable Clang and LLD
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Check Cortex-M0+ memory budgets
        run: python3 OpenSERVO42C/tests/test_link_budget.py

      - name: Compile all Cortex-M0+ modules
        run: python3 OpenSERVO42C/tools/check_arm.py
